<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Tszh Remote - 我的</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a1228; color: #dbe1ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 24px; padding-top: calc(env(safe-area-inset-top, 24px) + 24px); }
  .neumorphic-raised { background: #171f35; box-shadow: 6px 6px 12px rgba(0,0,0,0.5), -3px -3px 8px rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
  .user-card { text-align: center; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: #171f35; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 12px; box-shadow: 6px 6px 12px rgba(0,0,0,0.5), -3px -3px 8px rgba(255,255,255,0.02); }
  .user-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .user-status { font-size: 12px; color: #4ade80; }
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card { flex: 1; text-align: center; padding: 16px; border-radius: 12px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #ffb870; }
  .stat-label { font-size: 11px; color: #d8c3b1; margin-top: 4px; }
  .menu-item { display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .menu-icon { font-size: 18px; margin-right: 12px; }
  .menu-label { flex: 1; font-size: 14px; }
  .menu-value { font-size: 12px; color: #d8c3b1; margin-right: 8px; }
  .menu-arrow { color: #a08d7e; }
  .logout-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: rgba(147,0,10,0.3); color: #ffb4ab; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>
  <div class="user-card neumorphic-raised">
    <div class="avatar">👤</div>
    <div class="user-name" id="userName">未登录</div>
    <div class="user-status" id="userStatus">● 未连接</div>
  </div>

  <div class="stats-row">
    <div class="stat-card neumorphic-raised">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">总创作</div>
    </div>
    <div class="stat-card neumorphic-raised">
      <div class="stat-value" id="statToday">0</div>
      <div class="stat-label">今日</div>
    </div>
    <div class="stat-card neumorphic-raised">
      <div class="stat-value" id="statVideos">0</div>
      <div class="stat-label">视频</div>
    </div>
  </div>

  <div class="menu-item neumorphic-raised" onclick="openSettings('theme')">
    <span class="menu-icon">🎨</span>
    <span class="menu-label">主题切换</span>
    <span class="menu-value">深空观测者</span>
    <span class="menu-arrow">›</span>
  </div>
  <div class="menu-item neumorphic-raised" onclick="openSettings('notifications')">
    <span class="menu-icon">🔔</span>
    <span class="menu-label">通知设置</span>
    <span class="menu-value">已开启</span>
    <span class="menu-arrow">›</span>
  </div>
  <div class="menu-item neumorphic-raised" onclick="openSettings('connection')">
    <span class="menu-icon">🔗</span>
    <span class="menu-label">连接管理</span>
    <span class="menu-value" id="connStatus">在线</span>
    <span class="menu-arrow">›</span>
  </div>
  <div class="menu-item neumorphic-raised" onclick="openSettings('about')">
    <span class="menu-icon">ℹ️</span>
    <span class="menu-label">关于</span>
    <span class="menu-value">v1.0.0</span>
    <span class="menu-arrow">›</span>
  </div>

  <button class="logout-btn" onclick="logout()">退出登录</button>

<script>
  function openSettings(type) { window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'open_settings', settingsType: type })); }
  function logout() { window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'logout' })); }

  window.addEventListener('message', (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'profile_data') {
        document.getElementById('userName').textContent = data.username || '未登录';
        document.getElementById('statTotal').textContent = data.stats?.total || 0;
        document.getElementById('statToday').textContent = data.stats?.today || 0;
        document.getElementById('statVideos').textContent = data.stats?.videos || 0;
      }
    } catch {}
  });

  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'request_profile' }));
</script>
</body>
</html>
